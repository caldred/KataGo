# Analysis engine config for the M1 head-fitting data extraction
# (docs/bayes-m1-gate.md). Eigen CPU backend, 9x9.

logDir = analysis_logs
reportAnalysisWinratesAs = WHITE

maxVisits = 800

# Many independent queries in flight; one search thread per query.
# Eigen throughput scales with NN server threads.
numAnalysisThreads = 8
numSearchThreadsPerAnalysisThread = 1
numNNServerThreadsPerModel = 8
nnMaxBatchSize = 4
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
