# Analysis engine config for the M5 tail-data extraction
# (docs/bayes-m5-tailheads.md). CUDA GPU backend, 9x9.

logDir = analysis_logs
reportAnalysisWinratesAs = WHITE

maxVisits = 800

# GPU: one NN server thread feeding large batches from many concurrent
# single-threaded queries.
numAnalysisThreads = 16
numSearchThreadsPerAnalysisThread = 1
numNNServerThreadsPerModel = 1
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
