# M2 Bayesian-posterior config, 9x9, b18c384nbt.
# Head coefficients from the M1 gate (docs/bayes-m1-gate.md FINDINGS,
# commit dcdde3e3; Amendment B kept the winrate-space d-mean).
# All heads operate in white-perspective winrate units.

useBayesSearch = true
numSearchThreads = 1
useGraphSearch = false
useUncertainty = false
subtreeValueBiasFactor = 0.0   # M4 ablation target; off while auditing M2

bayesRho = 0.26

# log sigma = A + B log st, st = 0.5*shorttermWinlossError (chi^2 offset folded)
bayesSigmaA = 0.1560
bayesSigmaB = 0.9826

# residual sigma_d (d-mean-aware): log sigma_r^2 = A + B log st_node^2,
# lognormal mean correction (+0.526) folded into A: -1.9881 + 0.5261
bayesSigmaDA = -1.4620
bayesSigmaDB = 0.5022

# d-mean head: mover-persp winrate offset per unit centered log prior
bayesDMean = 0.0638

bayesDefaultSigma = 0.05
