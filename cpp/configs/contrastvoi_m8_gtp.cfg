# M7 paired replay: the match bot-1 (bayes) as a GTP engine
# (docs/bayes-m7-sim2real.md). Params = match64-rerun bot 1 exactly.

logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false

rules = tromp-taylor

allowResignation = false
ponderingEnabled = false

maxVisits = 64
numSearchThreads = 1
chosenMoveTemperature = 0
chosenMoveTemperatureEarly = 0

useBayesSearch = true
useBayesSelection = false
useBayesContrastSelection = true
useBayesChooseMu = false
useBayesContrastChooser = true
useGraphSearch = false
useUncertainty = false
subtreeValueBiasFactor = 0.0

bayesRho = 0.26
bayesSigmaA = 0.1560
bayesSigmaB = 0.9826
bayesSigmaDA = -1.4620
bayesSigmaDB = 0.5022
bayesDMean = 0.0638
bayesDefaultSigma = 0.05

nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 16
nnMaxBatchSize = 8
numNNServerThreadsPerModel = 1

resignThreshold = -0.95
resignConsecTurns = 6
bayesContrastDeviationZ = 0.50
